# Image PPT streams progress while model pages are generated and retried.
# Match the rate-limit backoff with an unbuffered progress stream.
location = /api/ai/ppt {
    proxy_pass http://127.0.0.1:5000/api/ai/ppt;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

location = /lingbi/api/ai/ppt {
