# Structured PPT returns the file after the model pipeline completes.
# Match the browser's 600 second deadline with a small proxy margin.
location = /api/ai/ppt-v2 {
    proxy_pass http://127.0.0.1:5000/api/ai/ppt-v2;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 660s;
    proxy_send_timeout 660s;
}

location = /lingbi/api/ai/ppt-v2 {
