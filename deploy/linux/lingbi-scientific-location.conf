# Scientific illustration returns metadata after image generation completes.
# Match the browser's 210 second overall deadline with a small proxy margin.
location = /api/ai/scientific-illustration {
    proxy_pass http://127.0.0.1:5000/api/ai/scientific-illustration;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 240s;
    proxy_send_timeout 240s;
}

location = /lingbi/api/ai/scientific-illustration {
    proxy_pass http://127.0.0.1:5000/api/ai/scientific-illustration;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 240s;
    proxy_send_timeout 240s;
}
