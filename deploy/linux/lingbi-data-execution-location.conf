# Statistics executes a bounded container job before returning results.
# Match the browser's 120 second deadline with a small proxy margin.
location = /api/data-processing/execute {
    proxy_pass http://127.0.0.1:5000/api/data-processing/execute;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 150s;
    proxy_send_timeout 150s;
}

location = /lingbi/api/data-processing/execute {
    proxy_pass http://127.0.0.1:5000/api/data-processing/execute;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 150s;
    proxy_send_timeout 150s;
}
