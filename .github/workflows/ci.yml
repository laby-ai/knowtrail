name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup research agent Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify isolated AgentScope protocol
        run: |
          python -m pip install -q -r services/research-agent/requirements.txt
          python services/research-agent/test_worker.py

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Research agent card persistence
        run: pnpm exec tsx scripts/test-research-agent-contract.ts

      - name: Paper search contracts
        run: pnpm run test:discovered-source-upload && pnpm run test:studio-nav-side-effects

      - name: Notebook home usability contract
        run: pnpm run test:notebook-home-usability

      - name: Search and catalog recovery
        run: pnpm exec tsx scripts/test-discover-search-recovery.ts && pnpm run test:notebook-catalog-store && pnpm exec tsx scripts/test-notebook-catalog-recovery.ts

      - name: Native PPT concurrent persistence
        run: pnpm exec tsx scripts/test-native-ppt-concurrency.ts

      - name: Source metadata recovery contract
        run: pnpm run test:source-metadata-recovery

      - name: Learning materials recovery contract
        run: pnpm exec tsx scripts/test-learning-materials-recovery.ts

      - name: Image and HTML PPT recovery contract
        run: pnpm exec tsx scripts/test-ppt-deck-recovery.ts

      - name: Conversation recovery contract
        run: pnpm exec tsx scripts/test-chat-history-recovery.ts

      - name: Deep research contracts
        run: pnpm run test:deep-research-contract

      - name: Research report recovery contract
        run: pnpm exec tsx scripts/test-research-report-recovery.ts

      - name: Knowledge map recovery contract
        run: pnpm exec tsx scripts/test-knowledge-map-recovery.ts

      - name: Hypothesis generation contracts
        run: pnpm run test:hypothesis-generation-contract

      - name: Data processing contracts
        run: pnpm run test:data-processing-plan

      - name: Data processing recovery contract
        run: pnpm exec tsx scripts/test-data-processing-recovery.ts

      - name: Research design recovery contract
        run: pnpm exec tsx scripts/test-research-design-recovery.ts

      - name: Experiment design contracts
        run: pnpm run test:experiment-design-contract

      - name: Academic writing contracts
        run: pnpm run test:academic-writing-contract

      - name: Text polishing contracts
        run: pnpm run test:text-polishing-contract

      - name: Peer review contracts
        run: pnpm run test:peer-review-contract

      - name: Scientific illustration recovery
        run: pnpm exec tsx scripts/test-scientific-illustration-recovery.ts

      - name: Scientific illustration contracts
        run: pnpm run test:scientific-illustration-contract

      - name: Cross-app authentication contract
        run: pnpm run test:cross-app-auth-contract

      - name: Unified client request contract
        run: pnpm run test:client-request-contract

      - name: Loopback listener contract
        run: pnpm run test:loopback-listener-contract

      - name: Request observability contract
        run: pnpm run test:request-observability

      - name: Grounded operational observability contract
        run: pnpm run test:grounded-operational-observability

      - name: Grounded task lifecycle contract
        run: pnpm run test:grounded-task-lifecycle

      - name: Architecture ownership guard
        run: ARCH_GUARD_STRICT=true pnpm run check:architecture

      - name: Code size report
        run: pnpm run check:code-size

      - name: Service metrics contract
        run: pnpm run test:service-metrics

      - name: Long-task admission contract
        run: pnpm run test:long-task-admission

      - name: Release environment gate
        run: pnpm run test:release-env-gate

      - name: Typecheck
        run: pnpm run ts-check

      - name: Lint
        run: pnpm run lint:build

      - name: Verify bounded runtime import
        run: python scripts/test-ci-runtime.py

      - name: Match the deployed build runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'

      - name: Prepare the deployed runtime source profile
        run: python scripts/package-ci-runtime.py --prepare

      - name: Complete the final Linux Next build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_BASE_PATH: /knowtrail
          NEXT_PUBLIC_DOMAIN: localhost:5000
          NEXT_PUBLIC_VIRTUAL_CLASSROOM_ORIGIN: /classroom-runtime
        run: pnpm exec next build

      - name: Complete the final Linux launcher build
        run: pnpm exec tsup src/server.ts --format cjs --platform node --target node20 --outDir dist --no-splitting --no-minify

      - name: Package the completed Linux runtime
        env:
          NEXT_PUBLIC_BASE_PATH: /knowtrail
          NEXT_PUBLIC_DOMAIN: localhost:5000
          NEXT_PUBLIC_VIRTUAL_CLASSROOM_ORIGIN: /classroom-runtime
        run: python scripts/package-ci-runtime.py ci-runtime

      - name: Retain the exact runtime and file manifest
        uses: actions/upload-artifact@v4
        with:
          name: knowtrail-linux-${{ github.run_id }}
          path: |
            ci-runtime.tar.gz
            ci-runtime.manifest.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
